name: docker-image

on:
  workflow_dispatch:
  schedule:
    # 每天晚上 12 点（北京时间），GitHub cron 使用 UTC 时间
    - cron: "0 16 * * *"

env:
  # HARBOR_SITE / HARBOR_NAMESPACE / PIP_HOST / RESOURCE_SERVER_URL
  # 已在仓库环境变量(GitHub variables)中配置,
  # 通过 vars.* 引用, 此处不再重复定义; 仅保留代码内的派生/版本变量
  DTK_VERSION: "26.10"    # dtk 版本号; 基础镜像 tag & 产物 tag 的 dtk 段 & pip nightly 源 token (dtk2604) 由此拼接
  OS_VERSION: "ubuntu22.04" # 基础镜像 tag 的系统版本段
  PY_VERSION: "py3.12"      # 基础镜像 tag 的 python 版本段
  TORCH_VERSION: "2.11.0" # 框架依赖的 torch 大版本, Dockerfile 内 das-install 的 torch_tag 随此推导
  RCCL_TESTS_COMMIT: "155f4748e6de7ce3ab54a0bf09931d9316262260" # rccl-tests 锁定 commit
  RCCL_GPU_TARGETS: "gfx936 gfx938"                             # rccl-tests 编译目标 GPU 架构

jobs:
  build:
    # 需要能访问内网 pip 源 / AICC 下载地址的自托管 runner
    runs-on:
      - self-hosted
      - hcu
      - hcu-ci-pr
      - nmz36
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 生成镜像 tag
        # 版本取自分支代码 setup.py 的 __version__ (如 '0.18.2+das.opt1.dtk2604'),
        # 取首个 '+' 前的主版本段 '0.18.2'; PY 段从基础镜像现场探测
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          BASE_IMAGE="${{ vars.HARBOR_SITE }}/hcu/base/dtk:${DTK_VERSION}-${OS_VERSION}-${PY_VERSION}"
          MEGATRON_VERSION=$(grep -oP "^__version__ = '\\K[^'\\+]+" setup.py | head -1)
          [ -n "${MEGATRON_VERSION}" ] || { echo "无法从 setup.py 解析版本号"; exit 1; }
          PY=$(docker run --rm "${BASE_IMAGE}" python3 -c 'import sys; print("py3.%d"%sys.version_info.minor)' 2>/dev/null || echo py3.10)
          echo "BASE_IMAGE=${BASE_IMAGE}" >> "$GITHUB_ENV"
          # Dockerfile 用完整 pip 链接 (vars.PYPI_URL 只存 host 段, 在这里拼好整链再传入)
          echo "PIP_INDEX_URL=${{ vars.PYPI_URL }}/nightly/dtk${DTK_VERSION//./}/+simple/" >> "$GITHUB_ENV"
          # BUILD_TIME: image.info 的 built 段, 与产物 tag 的时间段保持一致
          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=megatron:${MEGATRON_VERSION}-ubuntu22.04-dtk${DTK_VERSION//./}-${PY}-${BUILD_TIME}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=megatron:${MEGATRON_VERSION}-latest" >> "$GITHUB_ENV"

      - name: Build
        id: build_image
        run: |
          docker build --no-cache --network=host \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg RESOURCE_SERVER_URL="${{ vars.RESOURCE_SERVER_URL }}" \
            --build-arg PIP_INDEX_URL="${{ env.PIP_INDEX_URL }}" \
            --build-arg BUILD_TIME="${{ env.BUILD_TIME }}" \
            --build-arg TORCH_VERSION="${{ env.TORCH_VERSION }}" \
            --build-arg RCCL_TESTS_COMMIT="${{ env.RCCL_TESTS_COMMIT }}" \
            --build-arg RCCL_GPU_TARGETS="${{ env.RCCL_GPU_TARGETS }}" \
            --build-arg RCCL_TEST="${{ vars.RCCL_TEST }}" \
            -t "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${IMAGE_TAG}" \
            -f docker/Dockerfile .

      - name: 打两个 tag
        id: tag_image
        run: |
          docker tag "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${IMAGE_TAG}" "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${LATEST_TAG}"

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "${{ vars.HARBOR_SITE }}" -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Push
        run: |
          docker push "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${IMAGE_TAG}"
          docker push "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${LATEST_TAG}"

      - name: 登记 DashHub 镜像记录 (record)
        # 在刚构建的镜像里起临时容器装 cinotificate 并执行 --record_image 上报 DashHub
        # (IMAGE_TAG 环境变量由 -e 在运行时注入, tag 时间戳构建期不可知, 故不写进 Dockerfile);
        # 失败仅告警, 不影响构建/推送结果 (与 vllm-plugin 等镜像的 CI record 口径一致)
        if: always() && steps.build_image.outcome == 'success'
        continue-on-error: true
        run: |
          PIP_INDEX="${{ vars.PYPI_URL }}/nightly/dtk${{ env.DTK_VERSION }}/+simple/"
          PIP_HOST="$(echo "${{ vars.PYPI_URL }}" | sed 's#^http\?://##; s#:.*##')"
          INNER="set -e; \
            pip install --no-cache-dir cinotificate -i ${PIP_INDEX} --trusted-host ${PIP_HOST}; \
            python3 -c 'import cinotificate.main' >/dev/null 2>&1 || \
            pip install --no-cache-dir requests -i ${PIP_INDEX} --trusted-host ${PIP_HOST}; \
            CInotificate --record_image"
          docker run --rm --network=host \
            -e "IMAGE_TAG=${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${IMAGE_TAG}" \
            --entrypoint /bin/bash \
            "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${IMAGE_TAG}" \
            -c "${INNER}"

      - name: 删除本次构建镜像
        if: always() && steps.build_image.outcome == 'success'
        run: |
          docker rmi "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${IMAGE_TAG}" || true

      - name: 删除本次滚动 tag
        if: always() && steps.tag_image.outcome == 'success'
        run: |
          docker rmi "${{ vars.HARBOR_SITE }}/${{ vars.HARBOR_NAMESPACE }}/${LATEST_TAG}" || true
